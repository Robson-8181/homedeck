name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    # HACS reads the repository through the public GitHub API, so it can only validate a public repository.
    if: ${{ github.event.repository.private != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands: remove once the icons in brands/ are merged into home-assistant/brands.
          # license: HomeDeck is source-available (Free and Pro, see LICENSE), so it is installed as a
          # custom repository; HACS only accepts OSI-approved licenses in its default list.
          ignore: brands license

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  frontend:
    name: Frontend and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python3 scripts/version.py check
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Committed panel matches the source
        run: |
          git diff --exit-code -- custom_components/homedeck/frontend || {
            echo "::error::Run 'npm run build' in frontend/ and commit homedeck-panel.js."
            exit 1
          }
